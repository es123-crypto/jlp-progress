html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar-head);color:var(--bar-head-ink);padding:16px 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bar-head-muted)}
.htitle{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.05;letter-spacing:.01em;margin:2px 0 0}
.hdate{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--mono);font-size:11px;color:var(--bar-head-muted);text-align:right}
.hdate b{color:var(--bar-head-ink);font-size:13px;font-weight:500}
main{flex:1;padding-block:16px 104px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--bar-head);color:var(--bar-head-ink);border-color:var(--bar-head)}
.hero .lbl{color:var(--bar-head-muted)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lbl{font-size:11px;color:var(--muted)}
.cap{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero .cap{color:var(--bar-head-muted)}
.big{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.mid{font-family:var(--display);font-weight:700;font-size:34px;line-height:.9;font-variant-numeric:tabular-nums}
h2,.h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.num.s{font-size:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.pill{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-ahead .pill,.pill.st-ahead{background:var(--ahead-bg);color:var(--ahead-ink)}
.pill.st-onplan{background:var(--onplan-bg);color:var(--onplan-ink)}
.pill.st-behind{background:var(--behind-bg);color:var(--behind-ink)}
.c-ahead{color:var(--ahead-ink)} .c-onplan{color:var(--onplan-ink)} .c-behind{color:var(--behind-ink)}
.bar{position:relative;height:8px;background:var(--track);border-radius:999px}
.bar.lg{height:10px}.bar.sm{height:6px}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:999px}
.fill.st-ahead{background:var(--ahead)}.fill.st-onplan{background:var(--onplan)}.fill.st-behind{background:var(--behind)}
.bar .tk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tick);transform:translateX(-1px)}
.hero .bar{background:var(--hero-track)} .hero .bar .fill{background:var(--hero-fill)} .hero .bar .tk{background:var(--hero-tick)}
.sep{padding-top:12px;border-top:1px solid var(--line-soft)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);font:600 13px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:focus-visible,.nav a:focus-visible,.back:focus-visible{outline:3px solid var(--ahead);outline-offset:2px}
.back{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.sectitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 4px 0}
.note{font-size:12px;line-height:1.5;color:var(--ink-2);background:var(--note-bg);border-radius:10px;padding:10px 12px}
.foot{margin:0;font-size:11px;line-height:1.5;color:var(--muted);padding:0 4px}
.item{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line-soft)}
.item:first-of-type{border-top:0}
.item .nm{font-size:14px;font-weight:600}
.issue{display:flex;gap:10px;align-items:flex-start}
.issue .n{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:var(--behind-bg);color:var(--behind-ink);font:500 11px var(--mono);display:flex;align-items:center;justify-content:center}
.issue p{margin:0;font-size:13px;line-height:1.45;color:var(--ink-2)}
svg.curve{width:100%;height:auto;display:block}
.months{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font:10px var(--mono);color:var(--muted);text-align:center}
.legend{display:flex;gap:16px;font-size:11px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.hist{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line-soft)}
.hist:first-of-type{border-top:0}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
nav.nav a{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--idle);text-decoration:none;border-radius:10px}
nav.nav a[aria-current="page"]{color:var(--ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.5;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.view{animation:fadein .18s ease-out}@keyframes fadein{from{opacity:.4}to{opacity:1}}}

window.JLP_setData=function(d,status){try{if(d&&d.dataDate&&d.contracts){DATA=d;}}catch(e){}if(status)SYNC=status;render(true);};
window.JLP_setStatus=function(status){SYNC=status;const v=(location.hash||'#home').toLowerCase();if(v!=='#c01'&&v!=='#c02')render(true);};

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(s){const m=String(s||'').match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);if(!m)return null;return Date.UTC(+m[3],MON.indexOf(m[2]),+m[1]);}
function days(a,b){const x=pd(a),y=pd(b);return x==null||y==null?0:Math.round((x-y)/864e5);}
function pct(n){return (Math.round(n*100)/100).toFixed(2)+'%';}
function sgn(n,u){const r=Math.round(n*100)/100;return (r>=0?'+':'−')+Math.abs(r).toFixed(2)+(u||'%');}
function cl(n){return Math.max(0,Math.min(100,n));}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function st(v){return v>0.5?{k:'st-ahead',c:'c-ahead',t:'Ahead of plan'}:v<-0.5?{k:'st-behind',c:'c-behind',t:'Behind plan'}:{k:'st-onplan',c:'c-onplan',t:'On plan'};}
function dl(e,p){const d=days(e,p);return d>0?{t:d+' d late vs contract',s:'+'+d+' d',c:'c-behind'}:d<0?{t:(-d)+' d early vs contract',s:'−'+(-d)+' d',c:'c-ahead'}:{t:'On contract date',s:'',c:'c-onplan'};}
function weekOf(s){const t=pd(s);if(t==null)return'';const d=new Date(t);const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);const y0=new Date(Date.UTC(d.getUTCFullYear(),0,4));return 'Week '+(1+Math.round(((d-y0)/864e5-3+((y0.getUTCDay()+6)%7))/7));}
function bar(a,p,size){const s=st(a-p);return `<div class="bar ${size||''}" role="img" aria-label="Actual ${pct(a)}, planned ${pct(p)}"><div class="fill ${s.k}" style="width:${cl(a)}%"></div><div class="tk" style="left:${cl(p)}%"></div></div>`;}
function kv(l,v,cls){return `<div class="kv"><span class="lbl">${esc(l)}</span><span class="num ${cls||''}">${esc(v)}</span></div>`;}
function daysLeft(o){const n=days(o.expFinish,DATA.dataDate);return n>0?n+' days left':(o.actual>=100?'Complete':'Finish date passed');}

function curve(pl,ac){
  const x0=18,x1=324,yb=122,yt=22,max=Math.max(100,...pl,...ac);
  const xs=i=>x0+(x1-x0)*i/4, ys=v=>yb-(yb-yt)*v/max;
  const path=a=>a.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
  const li=ac.length-1, lx=xs(li), ly=ys(ac[li]), ex=xs(pl.length-1), ey=ys(pl[pl.length-1]);
  const grid=[0,50,100].map(g=>`<line x1="${x0}" x2="${x1}" y1="${ys(g)}" y2="${ys(g)}" stroke="var(--line-soft)" stroke-width="1"/><text x="${x0-4}" y="${ys(g)+3}" text-anchor="end" font-size="9" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${g}</text>`).join('');
  return `<svg class="curve" viewBox="0 0 342 140" role="img" aria-label="S-curve: planned ${pct(pl[pl.length-1])} by ${DATA.months[4]}, actual ${pct(ac[li])}">${grid}
  <path d="${path(pl)}" fill="none" stroke="var(--planned-line)" stroke-width="2" stroke-dasharray="5 4"/>
  ${ac.length>1?`<path d="${path(ac)}" fill="none" stroke="var(--ahead)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}
  <circle cx="${lx}" cy="${ly}" r="5" fill="var(--ahead)" stroke="var(--card)" stroke-width="2"/>
  <text x="${lx+8}" y="${ly-8}" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--ahead-ink)">${pct(ac[li])}</text>
  <text x="${ex}" y="${ey-8}" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">Pl ${pct(pl[pl.length-1])}</text></svg>
  <div class="months">${DATA.months.map(m=>`<span>${m}</span>`).join('')}</div>
  <div class="legend"><span><span style="width:16px;border-top:2px dashed var(--planned-line)"></span>Planned</span><span><span style="width:16px;height:3px;background:var(--ahead);border-radius:2px"></span>Actual</span></div>`;
}

function home(){

    <div class="grid3">${kv('Planned',pct(c.planned),'s')}${kv('Variance',sgn(c.actual-c.planned),'s '+s.c)}${kv('Last update',sgn(c.actual-c.prev,' pts'),'s')}</div>
    <div class="row sep" style="align-items:center"><div class="kv"><span class="lbl">Expected finish</span><span class="num" style="font-weight:500">${c.expFinish}</span><span class="lbl ${d.c}">${d.t}</span></div>
    ${c.detail?`<a class="btn" href="#${c.code.toLowerCase()}">Details<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>`:`<span class="num s" style="color:var(--muted)">${daysLeft(c)}</span>`}</div></article>`;
  });
  h+=`<p class="foot">Status on progress %: Ahead &gt; +0.5 % · On plan ±0.5 % · Behind &lt; −0.5 %. Black tick = planned %. Source: ${esc(DATA.source)}.</p>${(IN_APP||LIVE)?`<p class="foot" id="sync">${esc(SYNC)}</p>`:''}`;
  return h;
}

  <div class="kv"><span class="eyebrow" style="color:var(--muted)">Contract No.${c.no} · ${esc(c.contractor)}</span><span style="font-weight:600;font-size:16px">${esc(c.scope)}</span></div></div>

  <section class="card"><h2>Key dates</h2><div class="grid2">${kv('Commencement',t.commencement)}${kv('Contractual finish',c.plannedFinish)}${kv('Expected finish',c.expFinish)}${kv('Forecast vs contract',d.t,d.c)}</div><div class="note">${esc(t.finishNote)}</div></section>

  <section class="card"><h2>Commercial · SAR</h2><div class="grid2">${t.commercial.map(k=>kv(k.label,k.value)).join('')}</div></section>

}
